<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>哈基米交易 v2</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050707;
      --panel: #101514;
      --line: #202927;
      --text: #f4f7f5;
      --muted: #8d9a96;
      --blue: #2d7dff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(520px, calc(100vw - 48px));
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 28px;
    }

    .mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .bar {
      height: 3px;
      margin-top: 24px;
      background: #1b2523;
      overflow: hidden;
    }

    .bar span {
      display: block;
      width: 38%;
      height: 100%;
      background: var(--blue);
      animation: move 1.25s ease-in-out infinite;
    }

    @keyframes move {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(270%); }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">H</div>
    <h1 id="title">正在启动哈基米交易</h1>
    <p id="detail">正在准备本机行情与策略服务。</p>
    <div class="bar"><span></span></div>
  </main>
  <script>
    window.setBootStatus = function setBootStatus(title, detail) {
      document.getElementById("title").textContent = title || "正在启动哈基米交易";
      document.getElementById("detail").textContent = detail || "";
    };
  </script>
</body>
</html>
