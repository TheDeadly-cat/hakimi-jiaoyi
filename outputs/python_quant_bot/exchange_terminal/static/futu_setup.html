<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>富途 OpenD 配置 - 哈基米交易</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050707;
      --panel: #101514;
      --line: #202927;
      --text: #f4f7f5;
      --muted: #8d9a96;
      --blue: #2d7dff;
      --green: #35d48a;
      --red: #ff5c72;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(560px, calc(100vw - 32px));
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: var(--muted);
      font-size: 12px;
    }

    input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      background: #070a0a;
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      height: 40px;
      border: 0;
      background: var(--blue);
      color: #fff;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #1a2321;
      border: 1px solid var(--line);
    }

    pre {
      min-height: 88px;
      margin: 18px 0 0;
      padding: 12px;
      border: 1px solid var(--line);
      background: #070a0a;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok { color: var(--green); }
    .bad { color: var(--red); }
  </style>
</head>
<body>
  <main>
    <h1>富途 OpenD 配置</h1>
    <p>账号和密码只提交到本机 127.0.0.1。密码会转为 MD5 写入 FutuOpenD.xml，不会显示在聊天里。</p>

    <form id="form">
      <label for="account">富途账号</label>
      <input id="account" autocomplete="username" placeholder="手机号/邮箱/用户 ID" required />

      <label for="password">富途登录密码</label>
      <input id="password" type="password" autocomplete="current-password" required />

      <div class="actions">
        <button type="submit">保存到 OpenD</button>
        <button class="secondary" id="check" type="button">检查端口</button>
      </div>
    </form>

    <form id="verifyForm">
      <label for="code">手机验证码</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="短信验证码" />

      <div class="actions">
        <button type="submit">提交验证码</button>
        <button class="secondary" id="enableTelnet" type="button">启用控制端口</button>
      </div>
    </form>

    <pre id="result">等待输入。</pre>
  </main>

  <script>
    const result = document.getElementById("result");
    const form = document.getElementById("form");
    const verifyForm = document.getElementById("verifyForm");
    const account = document.getElementById("account");
    const password = document.getElementById("password");
    const code = document.getElementById("code");

    function show(text, ok = true) {
      result.className = ok ? "ok" : "bad";
      result.textContent = text;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      show("正在写入本机 FutuOpenD.xml...");
      try {
        const response = await fetch("/api/futu/configure", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ account: account.value, password: password.value }),
        });
        const data = await response.json();
        if (!data.ok) throw new Error(data.error || "写入失败");
        password.value = "";
        show(`${data.message}\n账号：${data.account}\n现在回到 Codex 告诉我：已输入。`);
      } catch (error) {
        show(error.message, false);
      }
    });

    verifyForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      show("正在提交验证码到本机 FutuOpenD...");
      try {
        const response = await fetch("/api/futu/verify-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code.value }),
        });
        const data = await response.json();
        if (!data.ok) throw new Error(data.error || "验证码提交失败");
        code.value = "";
        show(`${data.message}\n现在回到 Codex 告诉我：验证码已提交。`);
      } catch (error) {
        show(error.message, false);
      }
    });

    document.getElementById("enableTelnet").addEventListener("click", async () => {
      show("正在启用 OpenD 本机控制端口...");
      try {
        const response = await fetch("/api/futu/enable-telnet", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        const data = await response.json();
        if (!data.ok) throw new Error(data.error || "启用失败");
        show(`控制端口已写入：${data.host}:${data.port}\n需要重启 FutuOpenD 后生效。`);
      } catch (error) {
        show(error.message, false);
      }
    });

    document.getElementById("check").addEventListener("click", async () => {
      show("正在检查 FutuOpenD 状态...");
      try {
        const response = await fetch("/api/futu/status?force=true", { cache: "no-store" });
        const data = await response.json();
        show(`OpenD：${data.opend_online ? "ONLINE" : "OFFLINE"}\n端口：${data.host}:${data.port}\n状态：${data.message}`);
      } catch (error) {
        show(error.message, false);
      }
    });
  </script>
</body>
</html>
