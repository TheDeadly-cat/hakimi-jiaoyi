const fmt=(value,digits=2)=>value===null||value===undefined||!Number.isFinite(Number(value))?'—':Number(value).toLocaleString('zh-CN',{minimumFractionDigits:digits,maximumFractionDigits:digits});

async function api(path,method='GET',body){if(!token)throw {info:{code:'SESSION_REQUIRED',message:'请从软件的图形界面入口重新打开此窗口。',detail:'页面缺少本地会话凭据；无需填写账号或密码。'}};const control=new AbortController(),timeout=setTimeout(()=>control.abort(),20000);try{const response=await fetch('/api/'+path,{method,headers:{'Accept':'application/json','X-Hakimi-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,signal:control.signal,credentials:'same-origin',cache:'no-store'});let value;try{value=await response.json();}catch(_){throw {info:{message:'本地服务返回了无法识别的响应。请查看设置与日志。',code:'INVALID_RESPONSE'}};}if(!response.ok||!value.ok)throw {info:value.error||{message:'本地请求未完成。',code:String(response.status)}};setConnection(true);return value.data;}catch(e){if(!e.info){setConnection(false);e.info={message:method==='POST'?'尚未确认这次操作的结果。请查看操作记录，不要重复提交。':'无法连接本地服务，请确认软件窗口仍在运行，然后刷新。',detail:e.name==='AbortError'?'本地请求等待超时。':String(e),code:'CONNECTION_LOST'};}throw e;}finally{clearTimeout(timeout);}}

function dashboard(){const recent=S.runs[0],detail=recent?S.runCache.get(recent.id):null;return heading('工作台','从本地行情开始，创建策略并查看回测结果。',btn('新建任务','create','primary','plus')+btn('导入行情','import','outline','upload'))+`<div class="steps">${[['inputs','导入数据','导入本地行情数据'],['tasks','配置策略','设置交易规则参数'],['tasks','运行回测','基于历史数据回测'],['results','分析结果','查看绩效与细节']].map((x,i)=>`<button class="step ${i===(S.inputs.length?S.tasks.length?S.runs.length?3:2:1:0)?'active':''}" data-view="${x[0]}"><span class="step-number">${i+1}</span><span><strong>${x[1]}</strong><small>${x[2]}</small></span></button>`).join('')}</div>`+(!S.inputs.length?`<section class="panel onboarding"><div class="empty-icon">${icon('chart')}</div><div><h2>开始第一次离线回测</h2><p>可以先用明确标注的虚构数据熟悉操作，再导入自己的行情。所有任务、输入和结果保存在当前本地工作区。</p><div class="actions">${!S.overview.initialized?btn('使用虚构示例','demo','primary','play'):''}${btn('导入自己的行情','import','outline','upload')}</div>${S.overview.initialized?'<p class="small">当前工作区已有目录，示例不会覆盖现有文件。请导入行情继续。</p>':''}</div></section>`:'')+`<div class="grid-main ${!S.inputs.length?'section-gap':''}"><section class="panel"><div class="panel-head"><h2>我的策略任务</h2>${btn('查看全部','all-tasks','small ghost','arrow')}</div>${taskRows(S.tasks.slice(0,5),true)}</section><section class="panel"><div class="panel-head"><h2>最近运行</h2>${recent?.data_kind==='SYNTHETIC_TEST'?'<span class="chip synthetic">虚构测试数据</span>':''}</div>${recent?`<div class="panel-body"><dl class="kv"><dt>任务</dt><dd>${esc(runTitle(recent))}<br><span class="version-label">${esc(runVersion(recent))}</span></dd><dt>回测区间</dt><dd>${esc(recent.score_start)} 至 ${esc(recent.score_end)}</dd><dt>证券</dt><dd>${esc(recent.symbol||'—')}</dd><dt>成交数量</dt><dd class="numeric">${fmt(recent.fill_count,0)} 笔</dd><dt>净收益率</dt><dd class="numeric ${direction(recent.total_return)}">${percent(recent.total_return,true)}</dd></dl>${btn('查看完整结果','open-run','primary wide summary-action','chart',`data-id="${esc(recent.id)}"`)}</div>`:empty('尚无运行结果','运行完成后，这里会显示最新结果。历史结果会保留 function inputsPage(){const term=S.inputSearch.toLowerCase(),rows=S.inputs.filter(x=>[x.label,inputName(x),x.kind].join(' ').toLowerCase().includes(term));return heading('数据中心','导入本地行情与已有研究输入，核对覆盖范围和来源。',btn('导入行情','import','primary','upload')+btn('导入已有输入','import-document','','file'))+`<section class="panel"><div class="panel-head"><h2>已封存输入 <span class="muted small">${S.inputs.length} 项</span></h2><input class="search" type="search" data-search="inputs" value="${esc(S.inputSearch)}" placeholder="搜索证券或数据类型" aria-label="搜索输入"></div>${rows.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>证券 / 输入</th><th>类型</th><th>覆盖范围</th><th>交易日</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(inputName(x))}</strong><span class="sub">${esc(x.source?.name||x.label||'已有本地输入')}${x.evidence_kind==='SYNTHETIC_TEST'?' · 虚构示例':''}</span></td><td>${esc(({PRICE_SNAPSHOT:'行情快照',SCHEDULE_CONTEXT:'公告排期',CONTENT_CONTEXT:'财报内容',INVALID_INPUT:'不可用文件'})[x.kind]||x.kind)}</td><td>${x.coverage_start?esc(x.coverage_start+' 至 '+x.coverage_end):'按事件版本记录'}</td><td class="numeric">${x.sessions??'—'}</td><td>${status(x.status)}</td><td>${btn('查看','input-detail','small','file',`data-id="${esc(x.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty(S.inputs.length?'没有匹配的输入':'尚未导入数据',S.inputs.length?'试试其他证券名称或清空搜索。':'上传 CSV 行情并填写来源和交易日历声明，也可以导入已经保存的快照或研究上下文。',btn('导入行情','import','primary','upload'),'data')}</section><div class="section-gap">${notice('当前适用范围','美股正股、美元、常规交易时段日线。只使用完整日线；拆股、分红记账和实时行情尚未接入。来源声明会封存，不等于来源已认证。')}</div>`;}
function tasksPage(){let rows=S.tasks.filter(t=>S.filter==='all'||t.state===S.filter);if(S.taskSearch)rows=rows.filter(t=>[taskTitle(t),strategyTitle(t.strategy),inputName(t.inputs?.snapshot)].join(' ').toLowerCase().includes(S.taskSearch.toLowerCase()));return heading('策略任务','管理参数、输入与启停状态。修改会保存新版本，旧结果保持不变。',btn('新建任务','create','primary','plus'))+`<section class="panel"><div class="panel-head"><h2>任务列表 <span class="small muted">${S.tasks.length} 项</span></h2></div><div class="toolbar"><div class="filters" role="group" aria-label="按任务状态筛选">${[['all','全部'],['ENABLED','已启用'],['PAUSED','已暂停']].map(([key,label])=>`<button class="filter ${S.filter===key?'active':''}" data-filter="${key}" aria-pressed="${S.filter===key}">${label}</button>`).join('')}</div><input class="search" type="search" data-search="tasks" value="${esc(S.taskSearch)}" placeholder="搜索任务、策略或证券" aria-label="搜索任务"></div>${taskRows(rows)}</section>`;}
function resultsPage(){if(!S.runs.length)return heading('回测结果','查看保存的净值、回撤、成交与决策原因。')+`<section class="panel">${empty('还没有回测结果','先创建并运行一个任务。结果保留在本机，重开软件后仍可查看。',btn('查看策略任务','all-tasks','primary','tasks'),'chart')}</section>`;const id=S.selectedRun||S.runs[0].id,detail=S.runCache.get(id);return heading('回测结果','各任务使用独立本金。勾选至少两项，对照保存结果。',btn(`比较已选（${S.compare.size}）`,'compare','primary','compare',S.compare.size<2?'disabled':''))+`<div class="results-layout"><section class="panel"><div class="panel-head"><h2>运行记录</h2><span class="small muted">${S.runs.length} 项</span></div><ul class="run-list">${S.runs.map(r=>`<li class="run-row ${r.id===id?'selected':''}"><input type="checkbox" data-run-check="${esc(r.id)}" ${S.compare.has(r.id)?'checked':''} aria-label="加入比较：${esc(runTitle(r)+' '+runVersion(r)+' '+r.score_start+'，结果 '+shortRunId(r)+'，'+startedLabel(r))}"><button data-action="select-run" data-id="${esc(r.id)}"><strong>${esc(runTitle(r))}</strong><small><span class="version-label">${esc(runVersion(r))}</span> · ${esc(r.strategy?.title||r.label||'')}</small><small>${esc(r.symbol)} · ${esc(r.score_start)} 至 ${esc(r.score_end)}</small><small>${esc(startedLabel(r))}<br>结果编号 ${esc(shortRunId(r))}</small><span class="result-return numeric ${direction(r.total_return)}">${percent(r.total_return,true)}</span></button></li>`).join('')}</ul></section><div>${detail?`<section class="panel"><div class="result-heading"><h2>${esc(runTitle(detail.summary))}</h2><p><span class="version-label">${esc(runVersion(detail.summary))}</span> · ${esc(detail.summary.strategy?.title||detail.summary.label||'')}</p><p>${esc(detail.summary.symbol)} · ${esc(detail.summary.score_start)} 至 ${esc(detail.summary.score_end)}${detail.summary.data_kind==='SYNTHETIC_TEST'?' · 虚构测试数据':''}</p><p>${esc(startedLabel(detail.summary))} · 结果编号 ${esc(shortRunId(detail.summary))}</p></div>${metricsRow(detail.summary)}${analysis(detail,false)}<div class="detail-section"><h3>结果说明</h3><p class="small">${esc(detail.research_input_outcome?.explanation||'费用与滑点已按任务保存配置计入。期末持仓按市值计价。')}</p>${limitationsHtml(detail.limitations)}<details class="details-disclosure"><summary>查看保存的配置与身份</summary><pre class="code-detail">${esc(JSON.stringify({configuration:detail.configuration,identities:detail.identities},null,2))}</pre></details></div></section>`:`<section class="panel"><div class="loading-block"><span class="spinner" aria-hidden="true"></span>正在读取保存的结果…</div></section>`}</div></div>`;}
function metricsRow(summary){return `<div class="metrics-row">${metricCells(summary)}</div>`;}
function metricCells(r){return `<div class="metric"><div class="label">净收益率</div><div class="value ${direction(r.total_return)}">${percent(r.total_return,true)}</div></div><div class="metric"><div class="label">扣费后损益</div><div class="value ${direction(r.net_pnl)}">${signedMoney(r.net_pnl)}</div></div><div class="metric"><div class="label">交易费用</div><div class="value">${money(r.total_fees)}</div></div><div class="metric"><div class="label">最大回撤</div><div class="value ${r.max_drawdown>0?'down':''}">${r.max_drawdown==null?'—':percent(-Math.abs(r.max_drawdown))}</div></div>`;}
function analysis(detail,compact){const tab=S.runTab;const tabs=[['equity','净值走势'],['drawdown','回撤'],['candles','行情走势'],['fills','成交明细'],['signals','决策记录']];let content;if(['equity','drawdown','candles'].includes(tab)){content=`<div class="${compact?'analysis-grid':''}"><div class="chart-panel">${chart(detail,tab,compact?'dashboard-chart':'result-chart')}</div>${compact?`<aside class="metrics" aria-label="回测指标">${metricCells(detail.summary)}</aside>`:''}</div>`;}else{const rows=detail[tab]||[];const cols=tab==='fills'?[['fill_time','成交时间'],['action','方向'],['quantity','数量'],['price','成交价'],['fee','费用'],['fill_basis','成交依据']]:[['signal_time','决策时间'],['action','意图'],['reason','原因']];content=dataTable(rows,cols,tab);}return `<div class="tabs" role="tablist" aria-label="回测结果内容">${tabs.map(([key,label])=>`<button class="tab ${tab===key?'active':''}" role="tab" aria-selected="${tab===key}" data-result-tab="${key}">${label}</button>`).join('')}</div><div role="tabpanel">${content}</div>`;}
function chart(detail,kind,id){const raw=kind==='candles'?(detail.candles||[]):(detail.equity_curve||[]);if(!raw.length)return empty('没有可展示的曲线','该保存结果未包含此类序列。可切换查看成交或决策记录。','','chart');let peak=0;const points=raw.map(row=>{const time=row.time||row.date||row.session||row.timestamp;const equity=Number(row.equity);peak=Math.max(peak,equity||0);return {...row,time,value:kind==='drawdown'?(row.drawdown!=null?-Math.abs(Number(row.drawdown))*100:peak>0?(equity/peak-1)*100:0):kind==='candles'?Number(row.close):equity};}).filter(p=>p.time&&Number.isFinite(p.value));if(!points.length)return empty('曲线格式暂不可展示','原结果仍然保留，可在保存的配置与身份中查看信息。','','chart');S.chartPoints.set(id,{points,kind});const W=900,H=275,L=67,R=20,T=20,B=45,x=i=>L+(W-L-R)*(points.length===1?.5:i/(points.length-1));let min=Math.min(...points.map(p=>kind==='candles'?Number(p.low):p.value)),max=Math.max(...points.map(p=>kind==='candles'?Number(p.high):p.value));if(kind==='drawdown')max=0;const pad=(max-min)*.12||Math.max(Math.abs(max)*.015,1);min-=pad;max+=kind==='drawdown'?pad*.2:pad;const y=v=>T+(max-v)/(max-min)*(H-T-B);let grid='';for(let i=0;i<5;i++){const v=min+(max-min)*i/4,yy=y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e1e8f0"/><text x="${L-12}" y="${yy+4}" text-anchor="end" fill="#52637b" font-size="11">${esc(fmt(v,kind==='drawdown'?1:0))}${kind==='drawdown'?'%':''}</text>`;}const ticks=[...new Set([0,Math.round((points.length-1)/3),Math.round((points.length-1)*2/3),points.length-1])];grid+=ticks.map((i,n)=>`<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B}" stroke="#edf1f7"/><text x="${x(i)}" y="${H-17}" text-anchor="${n===0?'start':n===ticks.length-1?'end':'middle'}" fill="#52637b" font-size="11">${esc(String(points[i].time).slice(0,10))}</text>`).join('');let series;if(kind==='candles'){const width=Math.max(1,Math.min(12,(W-L-R)/points.length*.65));series=points.map((p,i)=>{const up=Number(p.close)>=Number(p.open),color=up?'#c53545':'#087c62',top=y(Math.max(Number(p.open),Number(p.close))),bottom=y(Math.min(Number(p.open),Number(p.close)));return `<line x1="${x(i)}" x2="${x(i)}" y1="${y(Number(p.high))}" y2="${y(Number(p.low))}" stroke="${color}"/><rect x="${x(i)-width/2}" y="${top}" width="${width}" height="${Math.max(1,bottom-top)}" fill="${color}"/>`;}).join('');}else{const d=points.map((p,i)=>(i?'L':'M')+x(i).toFixed(2)+' '+y(p.value).toFixed(2)).join(' ');series=(kind==='drawdown'?`<path d="${d} L ${x(points.length-1)} ${y(0)} L ${x(0)} ${y(0)} Z" fill="#087c6212"/>`:'')+`<path d="${d}" fill="none" stroke="${kind==='drawdown'?'#087c62':'#2563eb'}" stroke-width="2.3" stroke-linejoin="round"/>`;}const label=kind==='candles'?'行情日线 · 涨红跌绿':kind==='drawdown'?'相对历史峰值的回撤（%）':'账户净值（美元）';return `<div class="chart-area" id="${id}" tabindex="0" data-chart="${id}" role="group" aria-label="${esc(label)}，使用左右方向键查看逐日数据"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><title>${esc(label)}，${esc(points[0].time)} 至 ${esc(points.at(-1).time)}</title>${grid}${series}</svg><div class="chart-tooltip hidden" aria-hidden="true"></div></div><div class="chart-caption"><span class="chart-legend"><i class="legend-line"></i>${label}</span><span>${points.length} 个数据点 · 移动鼠标或用方向键查看</span></div>`;}
function dataTable(rows,columns,key){if(!rows.length)return empty(key==='fills'?'没有成交':'没有决策记录',key==='fills'?'零成交也是有效结果。可查看决策记录了解观望或拒绝原因。':'此结果未包含相应记录。','','file');const size=30,page=Math.min(S.pages[key]||0,Math.max(0,Math.ceil(rows.length/size)-1));const cell=(row,k)=>{let v=row[k];if(k==='signal_time')v=v||row.time||row.decision_at;if(k==='price')v=v??row.fill_price;if(k==='fee')v=v??row.fees;if(k==='action')return esc(({BUY:'买入',SELL:'卖出',EXIT:'退出',HOLD:'观望'})[v]||v||'—');if(k==='fill_basis'&&v){const suffix='_EX_POST_VOLUME_CAPACITY',base=String(v).replace(suffix,'');return `<span title="${esc(v)}">${esc(FILL_BASIS[base]||base)}${String(v).endsWith(suffix)?'（事后成交量约束）':''}</span>`;}if(k==='reason'&&SIGNAL_REASON[v])return `<span title="${esc(v)}">${esc(SIGNAL_REASON[v])}</span>`;if(k.includes('time'))return esc(shortDate(v));if(['price','fee','quantity'].includes(k))return fmt(v,k==='quantity'?4:2);return esc(v??'—');};return `<div class="table-wrap"><table><thead><tr>${columns.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.slice(page*size,(page+1)*size).map(row=>`<tr>${columns.map(([key])=>`<td class="${['price','fee','quantity'].includes(key)?'numeric':''}">${cell(row,key)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="pagination"><span>共 ${rows.length} 条 · 第 ${page+1}/${Math.ceil(rows.length/size)} 页</span><div class="actions">${btn('上一页','page','small','',`data-key="${key}" data-page="${page-1}" ${page===0?'disabled':''}`)}${btn('下一页','page','small','',`data-key="${key}" data-page="${page+1}" ${(page+1)*size>=rows.length?'disabled':''}`)}</div></div>`;}
function fundsPage(){return heading('资金演练','当前图形界面专注于数据、策略与独立回测。')+`<section class="panel">${empty('共享资金演练尚未接入此界面','现有共享合成账户和回执不会改动。普通策略任务仍使用各自独立本金，不能将多任务结果相加当作共享组合。',btn('查看回测结果','all-results','primary','chart'),'funds')}</section><div class="section-gap">${notice('当前可用的操作','可以在策略任务中设置本金、费用与风险限制，运行并比较保存的结果。这里不会提供尚未接通的下单或账户按钮。')}</div>`;}
function settingsPage(){const o=S.overview;return heading('设置与日志','查看当前工作区、运行范围和每一次操作的实际状态。',btn('刷新记录','refresh','','refresh'))+`<div class="help-grid"><section class="panel"><div class="panel-head"><h2>本地工作区</h2></div><div class="panel-body"><label class="sr-only" for="workspace-path">工作区位置</label><input id="workspace-path" class="wide mono" readonly value="${esc(o.workspace||'')}" aria-describedby="workspace-help"><p id="workspace-help" class="small muted" style="margin-top:10px">数据和结果保存在此目录。备份时保留整个工作区，旧结果不会因新任务被覆盖。</p><div class="actions" style="margin-top:14px">${btn('复制路径','copy-workspace','small','copy')}</div><dl class="kv"><dt>程序版本</dt><dd>${esc(o.version||'由本地安装提供')}</dd><dt>输入 / 任务 / 结果</dt><dd>${S.inputs.length} / ${S.tasks.length} / ${S.runs.length}</dd><dt>服务日志</dt><dd class="mono">${esc(o.log_path||o.log_directory||'在启动器的日志位置查看')}</dd></dl></div></section><section class="panel"><div class="panel-head"><h2>使用范围</h2></div><div class="panel-body"><p>这是本地离线回测工具。上传的数据只交给本机服务，不请求实时行情，也不连接券商账户或发送订单。</p><ul class="plain-list"><li>当前支持美股正股、美元、常规时段完整日线。</li><li>使用红色表示上涨／正收益，绿色表示下跌／负收益。</li><li>任务修改保存为新版本，旧报告保留原始身份。</li><li>操作状态未知时先核对任务和结果，不自动重试。</li></ul></div></section></div><section class="panel"><div class="panel-head"><h2>高级命令行工具</h2></div><div class="panel-body"><p class="muted">共享资金演练目前通过安装目录中的 <code>Start-Hakimi-CLI.cmd</code> 使用。这里保留现有命令行能力；图形界面当前支持本地数据、策略任务、回测与结果比较。</p></div></section><section class="panel"><div class="panel-head"><h2>操作记录</h2><span class="small muted">最近 ${S.jobs.length} 项</span></div>${S.jobs.length?S.jobs.map(j=>`<div class="log-row">${['queued','running'].includes(j.status)?'<span class="spinner" aria-hidden="true"></span>':icon(j.status==='succeeded'?'check':'info')}<div class="log-body"><div class="inline"><strong>${esc(ACTIONS[j.action]||j.action)}</strong>${status(j.status)}</div><p>${esc(j.message||'')}</p><small>${esc(shortDate(j.created_at))}</small><details class="details-disclosure"><summary>操作编号与具体记录</summary><pre class="  $$('input,select',$('#metadata-form')).forEach(x=>x.disabled=mode!=='form'||!S.mappingVerified||!S.preview?.mapping_complete);
 $('#metadata-file-input').disabled=mode!=='file';
}
async function previewCsv(button,remap=false){const file=$('#csv-file').files[0];if(!file)return showError({message:'请先选择一个 CSV 文件。'},'#import-error');const generation=++S.csvGeneration,currentFile=()=>generation===S.csvGeneration&&$('#csv-file')?.files[0]===file;S.mappingVerified=false;const confirmed=$('#mapping-confirmed');if(confirmed){confirmed.checked=false;confirmed.disabled=true;}syncMappingState();try{const mapping=remap?selectedMapping():S.selectedTemplate?.column_mapping||null;if(mapping&&CSV_COLUMNS.some(k=>!mapping[k]))return showError({message:'请为六个字段分别选择对应的 CSV 列。'},'#import-error');const base64=await fileBytes(file);if(!currentFile())return;const payload={csv_name:file.name,csv_base64:base64};if(mapping)payload.column_mapping=mapping;S.csv={name:file.name,base64,file,generation};await perform('preview_csv',payload,{button,errorTarget:'#import-error',onSuccess:result=>{if(!currentFile())return;S.preview=result;S.mappingVerified=!!result.mapping_complete;renderCsvPreview();}});}catch(e){if(currentFile())showError(e,'#import-error');}}
function renderCsvPreview(){const p=S.preview,defaults=p.defaults||{};$('#csv-preview').innerHTML=`<div class="form-section"><h3>确认列对应关系</h3><p class="section-note">系统只建议对应列，不猜日期格式、不调整价格。请核对下方原始样本；若更改列选择，需要重新检查。</p><div class="mapping-grid">${CSV_COLUMNS.map(k=>`<label>${CSV_LABELS[k]}<select data-csv-map="${k}" aria-label="${CSV_LABELS[k]}对应列"><option value="">请选择列</option>${(p.columns||[]).map(c=>`<option value="${esc(c)}" ${p.proposed_mapping?.[k]===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>`).join('')}</div><div class="actions">${btn('按所选列重新检查','remap-csv','','refresh')}</div><label class="check-label section-gap"><input id="mapping-confirmed" type="checkbox" ${p.mapping_complete?'':'disabled'} required><span>我已核对六列对应关系及原始样本。</span></label><p id="mapping-status" class="section-note" style="margin-top:10px">${p.mapping_complete?'列已检查。确认后继续填写来源与日历。':'尚未识别全部必需列。请选择对应列并重新检查。'}</p></div><div class="file-summary"><div><span class="muted small">数据行数</span><strong>${esc(p.row_count)}</strong></div><div><span class="muted small">覆盖范围</span><strong>${p.mapping_complete?esc(p.coverage_start+' 至 '+p.coverage_end):'待列检查通过'}</strong></div><div><span class="muted small">时区</span><strong>America/New_York</strong></div></div><div class="preview-table"><table><thead><tr>${(p.columns||[]).map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${(p.sample_rows||[]).slice(0,5).map(row=>`<tr>${(p.columns||[]).map(k=>`<td>${esc(row[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;if(!p.mapping_complete){$('#metadata-form').innerHTML=notice('先确认列对应关系','选择六列并重新检查后，才会显示来源和日历声明。');setImportStep(2);setMetadataMode();return;}const now=new Date().toISOString().replace(/\.\d{3}Z$/,'Z');$('#metadata-form').innerHTML=`<div class="form-section"><h3>证券与行情来源</h3><div class="form-grid"><div class="field"><label for="meta-symbol">证券代码</label><input id="meta-symbol" name="symbol" placeholder="例如 AAPL" value="${esc(defaults.symbol||'')}" required></div><div class="field"><label for="meta-exchange">交易所</label><select id="meta-exchange" name="exchange"><option value="XNAS">NASDAQ · XNAS</option><option value="XNYS">NYSE · XNYS</option></select></div><div class="field span-2"><label for="meta-security">稳定证券身份</label><input id="meta-security" name="security_id" placeholder="使用来源中可长期对应同一证券的标识" value="${esc(defaults.security_id||'')}" required><span class="hint">不把可能变化的代码自动当作永久身份；请按你的原始来源填写。</span></div><div class="field"><label for="meta-source">来源名称</label><input id="meta-source" name="source_name" placeholder="提供这份数据的来源" required></div><div class="field"><label for="meta-reference">来源链接或引用</label><input id="meta-reference" name="source_reference" placeholder="https://… 或 urn:…" required></div><div class="field"><label for="meta-retrieved">获取时间（UTC）</label><input id="meta-retrieved" name="retrieved_at" value="${esc(defaults.retrieved_at||now)}" required><span class="hint">YYYY-MM-DDTHH:MM:SSZ</span></div><div class="field"><label for="meta-asof">数据截点（UTC）</label><input id="meta-asof" name="as_of" value="${esc(defaults.as_of||now)}" required><span class="hint">请按实际可获得数据的时点核对</span></div><div class="field"><label for="meta-lag">完整日线可用延迟（秒）</label><input id="meta-lag" name="lag_seconds" type="number" min="0" step="1" value="${esc(defaults.lag_seconds??60)}" required></div></div></div><div class="form-section"><h3>交易日历</h3><p class="section-note">按纽约常规交易时段解释。缺失的工作日不能自动视为休市，请根据来源逐日确认。</p>${(p.missing_weekdays||[]).length?`<div class="date-list">${p.missing_weekdays.map(x=>{const date=typeof x==='string'?x:x.date;return `<label for="closed-date-${esc(date)}">${esc(date)}<select id="closed-date-${esc(date)}" name="closed-date-${esc(date)}" aria-label="${esc(date)} 缺失原因" data-closed-date="${esc(date)}" required><option value="">请选择缺失原因</option><option value="HOLIDAY">已核对：市场假日</option><option value="EXCHANGE_CLOSURE">已核对：交易所休市</option></select></label>`;}).join('')}</div>`:'<p class="small muted">覆盖区间没有缺失的工作日。</p>'}<div class="form-grid section-gap"><div class="field"><label for="meta-early">提前收盘日期（可留空）</label><input id="meta-early" name="early_close_dates" placeholder="2024-11-29，多日用逗号分隔"><span class="hint">按日历来源填写，不自动猜测</span></div><div class="field"><label for="meta-calendar-note">日历核对依据</label><input id="meta-calendar-note" name="calendar_note" placeholder="日历来源或核对说明" required></div></div><label class="check-label section-gap"><input type="checkbox" name="calendar_confirmed" required><span>已核对这一覆盖区间的开市、休市和提前收盘日期。</span></label></div><div class="form-section"><h3>数据声明</h3><div class="check-list"><label class="check-label"><input type="checkbox" name="completed_bars_only" required><span>所有行均为已结束的常规时段完整日线。</span></label><label class="check-label"><input type="checkbox" name="raw_unadjusted" required><span>价格为未复权的原始 OHLC。</span></label><label class="check-label"><input type="checkbox" name="shares_volume" required><span>成交量单位为股数。</span></label><label class="check-label"><input type="checkbox" name="identity_stable"><span>已核对证券在覆盖区间内身份稳定。</span></label></div><div class="field section-gap"><label for="meta-identity-note">证券身份核对说明</label><input id="meta-identity-note" name="identity_note" placeholder="填写核对依据；未确认时保留为未通过准入" required></div><label class="check-label section-gap"><input type="checkbox" name="action_free_confirmed"><span>已核对覆盖区间没有需要记账的拆股、分红等公司行为。</span></label><div class="field section-gap"><label for="meta-actions-note">公司行为核对说明</label><input id="meta-actions-note" name="actions_note" placeholder="填写核对依据；未确认时保留为未通过准入" required></div><p class="section-note" style="margin-top:15px">这些是你的输入声明，不会变成来源已认证的结论。身份或公司行为未确认时，输入可保留，但不能用于回测。</p></div>`;applyTemplateFields();renderTemplateSaveControls();setImportStep(2);setMetadataMode();}
function setMetadataMode(){const mode=$('input[name="metadata-mode"]:checked').value;$('#metadata-file').hidden=mode!=='file';$('#metadata-form').hidden=mode!=='form';$('#metadata-file-input').required=mode==='file';syncMappingState();}
async function importCsv(form,button){
 if(S.importStep!==3){if(S.importStep===1)await previewCsv($('#preview-csv'));else nextImportStep();return;}
 if(!S.mappingVerified||!S.preview?.mapping_complete||!$('#mapping-confirmed')?.checked)return showError({message:'请先检查并明确确认六列对应关系。'},'#import-error');
 if(!form.reportValidity())return;
 try{
  const file=$('#csv-file').files[0];if(!S.csv||S.csv.file!==file||S.csv.generation!==S.csvGeneration)throw {message:'请先检查当前选择的 CSV 文件。'};
  const payload={csv_name:S.csv.name,csv_base64:S.csv.base64},data=new FormData(form);let template=null;
  if(data.get('metadata-mode')==='file'){if(!canonicalCsv())throw {message:'已有元数据模式仅接受原始规范列。请改用向导填写以保留列映射。'};const metadata=$('#metadata-file-input').files[0];payload.metadata_name=metadata.name;payload.metadata_base64=await fileBytes(metadata);}
  else{
   const fields=['symbol','exchange','security_id','source_name','source_reference','retrieved_at','as_of','identity_note','actions_note','calendar_note'];
   const metadata=Object.fromEntries(fields.map(k=>[k,String(data.get(k)||'').trim()]));metadata.lag_seconds=Number(data.get('lag_seconds'));
   for(const k of ['identity_stable','action_free_confirmed','calendar_confirmed','completed_bars_only','raw_unadjusted','shares_volume'])metadata[k]=data.has(k);
   metadata.closed_dates=Object.fromEntries($$('[data-closed-date]',form).map(x=>[x.dataset.closedDate,x.value]));metadata.early_close_dates=String(data.get('early_close_dates')||'').split(/[,，\s]+/).map(x=>x.trim()).filter(Boolean);
   payload.metadata_form=metadata;payload.column_mapping=selectedMapping();if(data.has('save_template_after'))template=templatePayload();
  }
  if(template)payload.save_template=template;
  await perform('import_csv',payload,{button,errorTarget:'#import-error',close:true,onSuccess:result=>{
   S.message=importOutcome(result);nav('inputs');
  }});
 }catch(e){showError(e,'#import-error');}
}
function importOutcome(result){const saved=result?.template_save;return {title:'行情已封存',message:saved?.status==='UNKNOWN'?'行情已保存；模板保存结果需要核对。请查看操作记录，保留当前输入，不要重新导入。':saved?.status==='SAVED'?'行情与导入模板已保存。本次日期和核对声明不会复用于下一份文件。':'请查看准入状态；可用行情可以用于新建策略任务。',kind:saved?.status==='UNKNOWN'?'warning':'info'};}
function openDocumentImport(){modal('导入已有输入','复用已有行情快照、公告排期或财报内容上下文。',`<form id="document-form"><div id="document-error" class="form-error"></div><div class="field"><label for="document-file">已有输入 JSON</label><input id="document-file" type="file" accept=".json,application/json" required><span class="hint">仅接受当前支持的封存输入格式，不会提取新财报字段或自动核准内容。</span></div></form>`,`<span class="small">原文件不修改，导入后按内容身份保存。</span><div class="actions">${btn('取消','close-dialog')}<button type="submit" form="document-form" class="btn primary">导入并检查</button></div>`,true);}
function showInput(id){const item=S.inputs.find(x=>x.id===id);if(!item)return;modal(inputName(item),'封存输入与来源说明',`${item.reasons?.length?notice('准入尚未通过',item.reasons.join('；'),'warning'):''}<dl class="kv"><dt>类型</dt><dd>${esc(item.kind)}</dd><dt>状态</dt><dd>${status(item.status)}</dd><dt>覆盖范围</dt><dd>${item.coverage_start?esc(item.coverage_start+' 至 '+item.coverage_end):'按事件版本记录'}</dd><dt>来源</dt><dd>${esc(item.source?.name||'研究上下文中的既有来源')}</dd><dt>来源认证</dt><dd>来源声明及文件身份，不等于发布者已认证</dd></dl><details class="details-disclosure" open><summary>完整输入信息</summary><pre class="code-detail">${esc(JSON.stringify(item,null,2))}</pre></details>`,btn('关闭','close-dialog'));}
function showComparison(value){
 const comparable=value.status==='COMPARABLE_CONDITIONS',rows=value.rows||[],conditions=value.per_run_conditions||[];
 const cell=(v,key)=>v===undefined?'未记录':v===null?'不适用':percentKey(key)?percent(v):key==='initial_cash'?money(v):typeof v==='object'?JSON.stringify(v):String(v);
 const table=(items)=>`<div class="table-wrap"><table class="comparison-table"><thead><tr><th scope="col">对照项目</th>${rows.map((r,i)=>`<th scope="col">${i===0?'首项':'第 '+(i+1)+' 项'} · ${esc(runTitle(r))}<span class="sub">${esc(runVersion(r))}</span></th>`).join('')}</tr></thead><tbody>${items.map(item=>`<tr><th scope="row">${esc(item.label)}</th>${item.values.map((v,i)=>`<td class="${i>0&&JSON.stringify(v)!==JSON.stringify(item.values[0])?'changed':''}">${esc(cell(v,item.key))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 const params=[];
 for(const [group,label] of [['strategy_parameters','策略'],['risk','生效约束']]){
  const get=r=>{const e=r.configuration?.effective;if(!e)return {};if(group==='risk')return Object.fromEntries(['max_position_pct','min_cash_pct','leverage','stop_loss_pct','take_profit_pct','max_daily_loss_pct'].map(k=>[k,e[k]]));const p={...e.strategy_parameters};delete p.position_pct;delete p.target_position_pct;p.allocation_pct=e.allocation_pct;return p;};
  for(const key of new Set(rows.flatMap(r=>Object.keys(get(r)||{}))))params.push({key,label:label+' · '+(LABELS[key]||key),values:rows.map(r=>Object.hasOwn(get(r),key)?get(r)[key]:null)});
 }
 params.unshift({key:'strategy',label:'策略规则',values:rows.map(r=>r.title)});
 const changed=params.filter(x=>x.values.some(v=>JSON.stringify(v)!==JSON.stringify(x.values[0])));
 const common=[
  {key:'symbol',label:'证券',values:conditions.map(c=>c.dataset?.security?.symbol||c.dataset?.security_id)},
  {key:'score_start',label:'评分开始',values:conditions.map(c=>c.score_start)},
  {key:'score_end',label:'评分结束',values:conditions.map(c=>c.score_end)},
  ...['initial_cash','fee_rate','slippage_pct'].map(key=>({key,label:LABELS[key],values:conditions.map(c=>c[key])})),
  {key:'required_context_sessions',label:'预热交易日数',values:rows.map(r=>r.warmup?.required_context_sessions)}
 ];
 const deltas=value.differences_from_first||[];
 const requestDifferences=(value.configuration_differences_from_first||[]).filter(x=>x.fields?.length).map(diff=>`<h3 class="comparison-heading">第 ${diff.row} 项与首项</h3><div class="table-wrap"><table><thead><tr><th>保存字段</th><th>首项</th><th>第 ${diff.row} 项</th></tr></thead><tbody>${diff.fields.map(f=>{const key=f.path.split('.').at(-1),prefix=f.path.startsWith('requested')?'请求值':f.path.startsWith('effective')?'生效值':'规则';return `<tr><td>${esc(prefix+' · '+(LABELS[key]||key))}</td><td>${f.left_present?esc(cell(f.left,key)):'未显式填写'}</td><td>${f.right_present?esc(cell(f.right,key)):'未显式填写'}</td></tr>`;}).join('')}</tbody></table></div>`).join('');
 modal('保存结果对照','先看这次改了什么，再看结果；每项使用独立本金。',`${notice(comparable?'基础条件一致，可对照描述性结果':'条件不同，不计算跨行收益差',comparable?'评分数据、时段和资金成本相同。下方仍会明确列出策略与仓位差异。':(value.mismatches||[]).map(x=>'第 '+x.row+' 项：'+x.fields.map(k=>LABELS[k]||k).join('、')).join('；'),comparable?'info':'warning')}<h3 class="comparison-heading">这次改了什么</h3>${changed.length?table(changed):'<p class="section-note">已保存的策略参数与风控值没有差异。请继续核对数据与基础条件。</p>'}<p class="comparison-key">浅黄色表示与首项不同；展示的是每次运行时保存的配置。</p><details class="details-disclosure"><summary>查看全部参数与风控</summary>${table(params)}</details>${requestDifferences?`<details class="details-disclosure"><summary>查看请求值、生效值与规则的完整差异</summary>${requestDifferences}</details>`:''}<details class="details-disclosure" ${comparable?'':'open'}><summary>查看评分区间、本金与成本</summary>${table(common)}${!comparable?'<details class="details-disclosure"><summary>查看数据与运行环境身份</summary><pre class="code-detail">'+esc(JSON.stringify(conditions,null,2))+'</pre></details>':''}</details><h3 class="comparison-heading">结果对照</h3><div class="table-wrap"><table><thead><tr><th>任务与版本</th><th>净收益率</th><th>相对首项</th><th>净损益</th><th>最大回撤</th><th>费用</th><th>成交</th></tr></thead><tbody>${rows.map((r,i)=>{const d=deltas.find(x=>x.row===i+1);return `<tr><td>${esc(runTitle(r))}<span class="sub">${esc(runVersion(r))} · ${esc(shortRunId(r))}</span></td><td>${percent(r.net_return,true)}</td><td>${!comparable?'不可比':i===0?'首项':d?`${d.net_return>0?'+':''}${fmt(d.net_return*100)} 个百分点`:'未记录'}</td><td>${signedMoney(r.net_pnl)}</td><td>${percent(-Math.abs(r.max_drawdown))}</td><td>${money(r.total_fees)}</td><td>${r.fills}</td></tr>`;}).join('')}</tbody></table></div><details class="details-disclosure"><summary>比较口径与限制</summary><ul class="plain-list">${(value.interpretation||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`,`<span class="small">只读保存结果 · 新增经济运行 ${value.new_economic_runs??'—'}</span>${btn('关闭','close-dialog')}`);
}
async function dispatch(action,target){const id=target?.dataset.id;switch(action){case'refresh':await refresh();break;case'all-tasks':nav('tasks');break;case'all-results':nav('results');break;case'logs':nav('settings');break;case'import':await openImport();break;case'import-back':setImportStep(Math.max(1,S.importStep-1));break;case'import-next':nextImportStep();break;case'save-template':await saveTemplate(target);break;case'teaching-example':await showTeachingExample(target.dataset.strategy);break;case'prepare-teaching':await prepareTeaching(target);break;case'return-task-form':returnTaskForm();break;case'import-document':openDocumentImport();break;case'input-detail':showInput(id);break;case'demo':await perform('initialize_demo',{}, {button:target,onSuccess:()=>{S.message={title:'虚构示例已准备',message:'示例使用 22 个交易日和明确的均线 2／4 参数。可选择任务运行，收益不代表真实市场表现。',kind:'info'};}});break;case'create':await openTaskForm();break;case'edit-task':await openTaskForm(id);break;case'task-detail':await showTask(id);break;case'close-dialog':closeDialog();break;case'run':await perform('run_task',{task_id:id},{button:target,onSuccess:detail=>{if(detail?.id){S.runCache.set(detail.id,detail);S.selectedRun=detail.id;}S.runTab='equity';S.message={title:'回测已完成',message:'结果已保存。可以查看成交、决策原因，或选择其他结果进行比较。',kind:'info'};nav('results');}});break;case'open-run':S.selectedRun=id;nav('results');await loadRun(id);break;case'select-run':S.selectedRun=id;S.pages={};render();await loadRun(id);break;case'state-task':await perform('set_task_state',{task_id:id,state:target.dataset.state},{button:target,errorTarget:'#task-detail-error',close:true,onSuccess:result=>{const state=result?.state;S.message={title:state==='ENABLED'?'任务已启用':state==='PAUSED'?'任务已暂停':'任务状态已更新',message:taskTitle(result)+'：'+(state==='ENABLED'?'已启用，可运行回测。':state==='PAUSED'?'已暂停；启用后可运行回测。':'请在任务列表核对当前状态。'),kind:'info'};}});break;case'check-task':await perform('check_task',{task_id:id},{button:target,errorTarget:'#task-detail-error',onSuccess:value=>{$('#task-detail-error').innerHTML=notice('输入与配置检查通过',value.can_run?'可以运行回测。本次检查没有新增经济运行。':'任务仍处于暂停状态；启用后可运行。本次检查没有新增经济运行。');}});break;case'copy-task':modal('复制为新任务','原任务和报告保持不变。',`<form id="copy-form" data-task-id="${esc(id)}"><div id="copy-error" class="form-error"></div><div class="field"><label for="copy-name">新任务名称</label><input id="copy-name" name="name" maxlength="64" required placeholder="例如：双均线对照"></div></form>`,`<span class="small">保留当前已选版本的参数与输入</span><div class="actions">${btn('取消','close-dialog')}<button type="submit" form="copy-form" class="btn primary">复制任务</button></div>`,true);break;case'preview-csv':await previewCsv(target);break;case'remap-csv':await previewCsv(target,true);break;case'compare':await perform('compare',{run_ids:[...S.compare]},{button:target,onSuccess:showComparison});break;case'page':S.pages[target.dataset.key]=Number(target.dataset.page);render();break;case'copy-workspace':try{await navigator.clipboard.writeText(S.overview.workspace);announce('工作区路径已复制');target.textContent='已复制';}catch(_){$('#workspace-path').select();announce('请复制已选中的工作区路径。');}break;}}
document.addEventListener('click',event=>{const view=event.target.closest('[data-view]');if(view){nav(view.dataset.view);return;}const action=event.target.closest('[data-action]');if(action&&!action.disabled){dispatch(action.dataset.action,action).catch(showError);return;}const filter=event.target.closest('[data-filter]');if(filter){S.filter=filter.dataset.filter;render();return;}const tab=event.target.closest('[data-result-tab]');if(tab){S.runTab=tab.dataset.resultTab;render();}});

document.addEventListener('change',event=>{
 const target=event.target;
 if(target.dataset.runCheck){target.checked?S.compare.add(target.dataset.runCheck):S.compare.delete(target.dataset.runCheck);render();}
 if(target.id==='task-strategy'){S.taskDraft.strategy=target.value;renderStrategyFields(true);}
 if(target.id==='task-snapshot')updateWarmup();if(target.name==='metadata-mode')setMetadataMode();
 if(target.dataset.csvMap){S.csvGeneration++;S.mappingVerified=false;$('#mapping-confirmed').checked=false;$('#mapping-confirmed').disabled=true;$('#mapping-status').textContent='列选择已改变，请按所选列重新检查。重新检查会清空本次声明。';syncMappingState();}
 if(target.id==='mapping-confirmed')syncMappingState();
 if(target.id==='csv-file')resetImportPreview();
 if(target.id==='csv-template'){S.selectedTemplate=S.csvTemplates.find(t=>t.id===target.value)||null;resetImportPreview();$('#template-selection-note').textContent=S.selectedTemplate?'已选择“'+S.selectedTemplate.name+'”。检查文件时将使用此列映射；日期与声明重新核对。':'不使用模板，系统只建议常见列名。';}
 if(target.id==='save-template-after')$('#csv-template-name').required=target.checked;
});
document.addEventListener('input',event=>{const target=event.target;if(target.dataset.search){const pos=target.selectionStart,key=target.dataset.search;if(key==='tasks')S.taskSearch=target.value;else S.inputSearch=target.value;render();const replacement=$(`[data-search="${key}"]`);replacement?.focus();try{replacement?.setSelectionRange(pos,pos);}catch(_){} }if(target.dataset.group==='params')updateWarmup();});
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target,button=event.submitter;if(form.id==='task-form')saveTask(form,button).catch(e=>showError(e,'#task-form-error'));if(form.id==='import-form')importCsv(form,button);if(form.id==='copy-form'&&form.reportValidity())perform('copy_task',{task_id:form.dataset.taskId,name:new FormData(form).get('name').trim()},{button,errorTarget:'#copy-error',close:true,onSuccess:result=>{S.message={title:'任务已复制',message:'已创建“'+taskTitle(result)+'”。'+(result?.state==='ENABLED'?'新任务已启用，可运行回测。':result?.state==='PAUSED'?'新任务处于暂停状态，启用后可运行。':'请在任务列表核对新任务状态。')+'源任务和旧结果保持不变。',kind:'info'};nav('tasks');}});if(form.id==='document-form'&&form.reportValidity())(async()=>{try{const file=$('#document-file').files[0];await perform('import_document',{filename:file.name,document_base64:await fileBytes(file)},{button,errorTarget:'#document-error',close:true,onSuccess:()=>{S.message={title:'输入已导入',message:'请查看这份输入的准入状态，再选择它创建或修订任务。',kind:'info'};nav('inputs');}});}catch(e){showError(e,'#document-error');}})();});
function tooltip(area,index){const data=S.chartPoints.get(area.dataset.chart);if(!data)return;index=Math.max(0,Math.min(data.points.length-1,index));area.dataset.index=index;const p=data.points[index],el=$('.chart-tooltip',area);el.classList.remove('hidden');el.innerHTML=`<strong>${esc(String(p.time).slice(0,19).replace('T',' '))}</strong><br>${data.kind==='candles'?`开 ${fmt(p.open)} · 高 ${fmt(p.high)}<br>低 ${fmt(p.low)} · 收 ${fmt(p.close)}`:data.kind==='drawdown'?`回撤 ${fmt(p.value)}%`:`净值 ${money(p.value)}`}`;}
document.addEventListener('pointermove',event=>{const area=event.target.closest('[data-chart]');if(!area)return;const data=S.chartPoints.get(area.dataset.chart);if(!data)return;const rect=$('svg',area).getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width;tooltip(area,Math.round((x-.074)/.904*(data.points.length-1)));});
document.addEventListener('keydown',event=>{const area=event.target.closest('[data-chart]');if(area&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const length=S.chartPoints.get(area.dataset.chart)?.points.length||1;tooltip(area,event.key==='Home'?0:event.key==='End'?length-1:Number(area.dataset.index||0)+(event.key==='ArrowLeft'?-1:1));}if(event.key==='Escape')closeNav();});
$('#navigation').innerHTML=[['dashboard','home'],['inputs','data'],['tasks','tasks'],['results','chart']].map(([key,i])=>`<button data-view="${key}">${icon(i)}<span>${VIEWS[key]}</span></button>`).join('');$('#settings-nav').innerHTML=icon('settings')+'<span>设置与日志</span>';$('#nav-toggle').innerHTML=icon('menu');$('#refresh').innerHTML=icon('refresh')+'刷新';$('#refresh').onclick=()=>refresh();$('#nav-toggle').onclick=()=>{const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#nav-shade').classList.toggle('open',open);$('#nav-toggle').setAttribute('aria-expanded',String(open));};$('#nav-shade').onclick=closeNav;$('#dialog').addEventListener('close',()=>S.dialogKind=null);window.addEventListener('popstate',()=>{const view=location.hash.slice(1);S.view=VIEWS[view]?view:'dashboard';render();});const initial=location.hash.slice(1);S.view=VIEWS[initial]?initial:'dashboard';refresh();
})();
</script>
</body>
