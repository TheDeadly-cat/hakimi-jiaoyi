name: Research Contracts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    name: Python contracts
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HAKIMI_RUNTIME_READ_ONLY: "1"
      HAKIMI_SKIP_LOCAL_AI_ENV: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows Git long paths before checkout
        run: git config --global core.longpaths true

      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up locked Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node for cross-language capability projection tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install active research dependency closure
        run: python -m pip install --requirement requirements.research.lock

      - name: Install canonical research package
        run: python -m pip install --no-deps --editable .

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Check generated projection against canonical Python capability source
        run: python -B tools/generate_product_capabilities.py --check

      - name: Run complete research-only Python contracts
        working-directory: outputs/python_quant_bot
        run: >
          python -B -m unittest
          tests.test_exchange_terminal_layer_dependency_audit_v2
          tests.test_research_only_architecture
          tests.test_domain_contracts_fail_closed_v1
          tests.test_legacy_cli_boundary
          tests.test_quant_bot_backtest
          tests.test_quant_bot_protective_exit_contract_v1
          tests.test_reproducible_experiment_manifest_v1
          tests.test_backtest_reproducibility_builder_v1
          tests.test_research_dependency_lock_v1
          tests.test_research_ci_workflow_v1
          tests.test_canonical_product_capability_source_v1
          tests.test_canonical_cli_entrypoint_v1
          tests.test_frozen_evaluation_protocol_v1
          tests.test_canonical_research_core_source_v1
          tests.test_canonical_research_config_source_v1
          tests.test_canonical_research_data_source_v1
          tests.test_canonical_research_models_source_v1
          tests.test_canonical_research_strategy_base_hardening_v1
          tests.test_canonical_research_backtest_source_v1
          tests.test_canonical_research_execution_source_v1
          tests.test_canonical_research_risk_source_v1
          tests.test_package_metadata_v1
          tests.test_research_management_boundary
          tests.test_canonical_http_contract_source_v1
          tests.test_archived_execution_http_route_guard_v1
          tests.test_archived_paper_runtime_facade_v1
          tests.test_archived_paper_persistence_source_v1
          tests.test_stock_candle_market_schedule_gate_v1
          tests.test_stock_candle_completion_gate_v1
          tests.test_stock_candle_temporal_conformance_v1
          tests.test_stock_data_quality_boundary_v2

      - name: Install repository-only signature test dependency
        run: python -m pip install "cryptography==49.0.0"

      - name: Verify repository-only signed handoff contracts
        run: |
          $env:PYTHONPATH = (Join-Path $PWD "src") + [IO.Path]::PathSeparator + (Join-Path $PWD "outputs/python_quant_bot")
          python -B -m unittest discover -s tests/repository_only -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify pinned Futu SDK callback protocol in an isolated environment
        run: |
          $sdkRoot = Join-Path '${{ runner.temp }}' 'futu-sdk-contract'
          python -m venv $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdkPython = Join-Path $sdkRoot 'Scripts/python.exe'
          & $sdkPython -m pip install --requirement requirements.futu-sdk.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sdkPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:APPDATA = Join-Path $sdkRoot 'private-sdk-logs'
          & $sdkPython -B -m unittest discover -s tests/sdk_contracts -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deterministic-references:
    name: Deterministic references
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows Git long paths before checkout
        run: git config --global core.longpaths true

      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up locked Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install active research dependency closure
        run: python -m pip install --requirement requirements.research.lock

      - name: Install canonical research package
        run: python -m pip install --no-deps --editable .

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify deterministic input identity
        working-directory: outputs/python_quant_bot
        run: python -B examples/deterministic_experiment/verify.py

      - name: Verify existing frozen evaluation protocol
        if: ${{ !cancelled() }}
        working-directory: outputs/python_quant_bot
        run: python -B -m unittest tests.test_frozen_evaluation_protocol_v1

  legacy-reference-replay:
    name: Historical developer reference replay
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows Git long paths before checkout
        run: git config --global core.longpaths true

      - name: Check out current verification harness without credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out immutable historical source and reference resources
        uses: actions/checkout@v7
        with:
          ref: 4fb6d191b282ea9a0d7136f4b94a9e9d49642178
          path: .legacy-reference-source
          persist-credentials: false

      - name: Set up locked Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install active research dependency closure
        run: python -m pip install --requirement requirements.research.lock

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Replay five historical references and strict historical consumers
        run: python -B tools/run_legacy_reference_checks.py --legacy-root .legacy-reference-source --output-dir "${{ runner.temp }}/legacy-reference-evidence"

  mvp-contracts:
    name: Offline research MVP contracts
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows Git long paths before checkout
        run: git config --global core.longpaths true

      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up locked Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install active research dependency closure
        run: python -m pip install --requirement requirements.research.lock

      - name: Install canonical research package
        run: python -m pip install --no-deps --editable .

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run every root MVP behavior test
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

  electron-capability-contract:
    name: Electron capability contract
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows Git long paths before checkout
        run: git config --global core.longpaths true

      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify backend capability contract
        run: node outputs/hakimi_trade_electron/backend-runtime-contract.test.js

      - name: Verify aggregate gate rejects missing and unsuccessful checks
        if: ${{ !cancelled() }}
        run: node tools/research-ci-gate.test.js

      - name: Verify desktop navigation and release debug boundaries
        if: ${{ !cancelled() }}
        run: node outputs/hakimi_trade_electron/desktop-security-policy.test.js

  market-data-renderer:
    name: Market-data renderer
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HAKIMI_RUNTIME_READ_ONLY: "1"
      HAKIMI_SKIP_LOCAL_AI_ENV: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows Git long paths before checkout
        run: git config --global core.longpaths true

      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up locked Python runtime for real evidence projections
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install active research dependency closure
        run: python -m pip install --requirement requirements.research.lock

      - name: Install canonical research package
        run: python -m pip install --no-deps --editable .

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify existing market-data chart controller
        run: node outputs/python_quant_bot/exchange_terminal/static/chart_controller.test.js

      - name: Verify existing neutral evidence presentation
        if: ${{ !cancelled() }}
        run: node outputs/python_quant_bot/exchange_terminal/static/evidence_presentation.test.js

  terminal-python-contracts:
    name: Offline terminal Python contracts
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
      HAKIMI_RUNTIME_READ_ONLY: "1"
      HAKIMI_SKIP_LOCAL_AI_ENV: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows Git long paths before checkout
        run: git config --global core.longpaths true

      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up locked Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node for indicator parity contracts
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install terminal contract dependency closure
        run: python -m pip install --requirement requirements.terminal-ci.lock

      - name: Install canonical research package
        run: python -m pip install --no-deps --editable .

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify terminal coverage and fail-closed test runner
        run: |
          python -B tools/run_terminal_contracts.py --check-coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tools -p "test_terminal_ci_gate.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run every terminal contract using fixtures and loopback HTTP only
        run: python -B tools/run_terminal_contracts.py

  desktop-full-check:
    name: Complete desktop check
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NODE_PATH: ${{ github.workspace }}/outputs/hakimi_trade_electron/node_modules
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
      HAKIMI_RUNTIME_READ_ONLY: "1"
      HAKIMI_SKIP_LOCAL_AI_ENV: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows Git long paths before checkout
        run: git config --global core.longpaths true

      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up locked Python runtime for evidence fixtures
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install terminal contract dependency closure
        run: python -m pip install --requirement requirements.terminal-ci.lock

      - name: Install canonical research package
        run: python -m pip install --no-deps --editable .

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Install locked desktop test dependencies without Electron download
        working-directory: outputs/hakimi_trade_electron
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the locked Playwright Chromium for isolated DOM tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/hakimi-playwright
        working-directory: outputs/hakimi_trade_electron
        run: npx --no-install playwright install chromium

      # The complete check includes network-blocked Playwright DOM fixtures.
      # It does not start the Electron application or production server.
      - name: Verify completed-candle evidence at the chart boundary
        run: node --test outputs/python_quant_bot/exchange_terminal/static/candle-completion.test.js

      - name: Run the complete maintained desktop check script
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/hakimi-playwright
        working-directory: outputs/hakimi_trade_electron
        run: npm run check

  package-install-smoke:
    name: Package install smoke
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Cold Windows console processes plus the complete installed suite need
    # room to finish; every existing and owner-exit check remains mandatory.
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RESEARCH_REVIEWED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows Git long paths before checkout
        run: git config --global core.longpaths true

      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up locked Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install wheel build tools
        run: python -m pip install "setuptools>=77" wheel

      - name: Build wheel and verify fresh installation outside checkout
        run: python tools/verify_wheel.py --public-bundle-dir "${{ runner.temp }}/research-release-bundle"

      - name: Upload the exact accepted wheel and sanitized evidence
        uses: actions/upload-artifact@v7
        with:
          name: hakimi-research-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-release-bundle
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  research-required:
    name: Research required gate
    if: ${{ always() }}
    needs:
      - python-contracts
      - deterministic-references
      - legacy-reference-replay
      - mvp-contracts
      - electron-capability-contract
      - market-data-renderer
      - terminal-python-contracts
      - desktop-full-check
      - package-install-smoke
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows Git long paths before checkout
        run: git config --global core.longpaths true

      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Require exact success from every mandatory check
        env:
          RESEARCH_CI_NEEDS: ${{ toJSON(needs) }}
        run: node tools/research-ci-gate.js
